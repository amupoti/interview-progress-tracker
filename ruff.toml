target-version = "py310"
line-length = 120

[lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "S",       # bandit security checks
    "SIM",     # simplify
]

[lint.per-file-ignores]
# Tests use bare asserts by design.
"tests/**" = ["S101"]
