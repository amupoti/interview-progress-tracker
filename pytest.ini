[pytest]
testpaths = tests
addopts = --cov=app --cov=storage --cov-branch --cov-report=term-missing --cov-fail-under=98 --js-cov-fail-under=95
# Unclosed resources (e.g. SQLite connections) surface as unraisable warnings; fail on them.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
